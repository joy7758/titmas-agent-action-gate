name: Contract checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install reference implementation dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Validate governance boundary
        run: python scripts/validate_governance.py
      - name: Validate milestone contracts
        run: python scripts/validate_milestone.py
      - name: Validate installed integrations
        run: python -m titmas_action_gate.cli validate-install
      - name: Run unit tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Build source and wheel artifacts
        run: python -m build
